# MOGUL settings
#
# THIS FILE GOES TO GITHUB. Don't put real NAS paths or drive names in
# it: put those in mogul.local.toml instead (see mogul.local.toml.example).
# mogul.local.toml never goes to GitHub and overrides anything here.
#
# Folder paths can be absolute ("/mnt/nas/..."), start with "~",
# or be relative. Relative paths are relative to the folder this
# file is in.

[core]
# Where new files are dropped, one subfolder per media type
# (mogul_incoming/radio, later mogul_incoming/audiobooks, ...).
incoming = "mogul_incoming"

# Where downloads go to be par2-checked first, one subfolder per media type
# (mogul_monitor/radio). `mogul.py radio validate` checks/repairs them and
# moves the good files to incoming/<media type>. Later a watcher will keep
# an eye on this folder by itself.
monitor = "mogul_monitor"

# Where the catalog JSON files live. This is the source of truth:
# back it up.
json_store = "mogul_json"

# Where each scan writes its report (what was added, duplicates,
# problems).
reports = "mogul_reports"

# Hashes to store for every file. xxh64 is always included: it is
# the file ID, taken over the audio data only. The others are taken
# over the whole file. Choices: blake3, sha256, sha512, sha1, md5
# md5 and sha1 are what Internet Archive publishes for every file, so
# uploads can be checked against IA later. Entries scanned before a hash
# was added to this list get it with: mogul.py radio hashes
hashes = ["blake3", "sha256", "sha512", "sha1", "md5"]

[radio]
# --- Import (mogul.py radio import) ---
# Where sorted radio files end up. To point it at the NAS, set it in
# mogul.local.toml, not here.
library = "mogul_library/radio"

# Where extra copies of files already in the library are moved.
# Nothing is ever deleted.
dupes = "mogul_dupes/radio"

# true: a duplicate gets the same folder and name as the library file it
# matches (keeping its own extension), with (2), (3)... if there's more
# than one. false: it keeps its original name and subfolder.
rename_dupes = true

# Where bad recordings go when quarantined (mogul.py radio quarantine).
# Their catalog entries move to mogul_json/radio/_quarantine.json.
quarantine = "mogul_quarantine/radio"

# Folder layout inside the library, and the filename (the extension
# is added automatically). Tokens:
#   {show} {code} {yyyy} {mm} {dd} {month_name}
#   {HASH8} first 8 characters of the xxh64, uppercase
#   {hash8} same, lowercase
#   {part}  part number, two digits (01, 02...), for multi-part days
#   {notes} the notes from the original filename
# Anything in [square brackets] is left out when its token is empty, so
# "[_pt{part}]" only shows up for files that have a part number.
# If two different files would get the same name, the next 8
# characters of the xxh64 are used instead.
folder_template = "{show}/{yyyy}/{mm}"
filename_template = "{yyyy}-{mm}-{dd}_{code}[_pt{part}]_{HASH8}"

# --- Damaged (mogul.py radio damaged --auto-ok) ---
# --auto-ok marks a damaged file "ok" without listening when radio check
# found no more than this many seconds of audio lost, its real length
# matches its header, and there's no empty gap (seams: a faint tick).
auto_ok_max_missing = 0.5

# --- Scan (mogul.py radio scan) ---
# File types the radio scanner picks up.
extensions = ["mp3", "ogg", "oga", "opus", "m4a", "aac", "flac", "wma", "wav", "mka", "rm", "ra"]

# Store the short acoustic fingerprint digest for each file.
# Needs fpcalc (sudo apt install libchromaprint-tools).
fingerprint = true

# How incoming filenames look.
#   {code}  show code from the list below
#   {yyyy} {mm} {dd}  air date
#   [ ... ] optional part
#   {part}  part number after the date: "O&A 2005-03-14_02.mp3"
#   {notes} anything after " -- "
incoming_pattern = "{code} {yyyy}-{mm}-{dd}[_{part}][ -- {notes}]"

# Show codes -> full show names. Add more as needed.
[radio.shows]
"O&A" = "Opie and Anthony"
"R&F" = "Ron and Fez"
"HSS" = "Howard Stern Show"
"BPS" = "Black Phillip Show"
"O&J" = "Opie and Jimmy"
"SNV" = "Saturday Night Virus"

[movie]
# Where the movie library is. Set the real path in mogul.local.toml.
# One folder, or a list of them:
#   library = ["/media/Movies/movies-validated", "/media/Movies/movies-new"]
# Layout inside: <decade>/<Title (YYYY) {tmdb-ID}>/<movie file>, e.g.
#   1990-1999/Fight Club (1999) {tmdb-550}/Fight Club (1999).mkv
# `mogul.py movie tmdb` reads {tmdb-ID} out of the folder/file names, at
# any depth, so the decade folders don't matter.
library = "/media/Movies/movies-bulk"

# Video file types (used to list files that have no {tmdb-ID} in the name).
extensions = ["mkv", "mp4", "m4v", "avi", "mov", "wmv", "mpg", "mpeg", "ts", "m2ts", "vob", "iso", "webm", "flv", "divx", "ogm"]

# --- TMDB (mogul.py movie tmdb) ---
# The API key goes in secrets.toml, never here (see secrets.toml.example).
#
# Where the downloaded TMDB info is kept, one file per movie (550.json).
# It's a copy of TMDB's data that can always be downloaded again, so it
# doesn't go to GitHub (mogul_cache/ is in .gitignore).
tmdb_store = "mogul_cache/tmdb/movie"

# Extras fetched along with the basic details, all in one request per movie
# (TMDB allows up to 20). What each one is:
#   credits             full cast (character, billing order) and crew (job, department)
#   images              posters, backdrops, logos (file paths, sizes, language, votes)
#   videos              trailers, teasers, clips, featurettes (YouTube/Vimeo keys)
#   release_dates       every release per country: date, type (theatrical,
#                       digital, physical, TV...), rating (PG-13, R...), note
#   external_ids        IMDb, Wikidata, Facebook, Instagram, Twitter IDs
#   keywords            TMDB's keyword tags ("dual identity", "insomnia"...)
#   alternative_titles  other titles per country
#   translations        title/overview/tagline in other languages
# Also available, left out by default:
#   recommendations, similar   lists of other movies (change all the time)
#   reviews                    user reviews
#   watch/providers            where it's streaming/for rent, per country
#   lists                      user lists the movie is on
#   changes                    TMDB's edit history (last 14 days only)
#   releases                   the old version of release_dates
tmdb_append = ["credits", "release_dates", "external_ids", "keywords", "alternative_titles", "translations"]

# Language for titles/overviews. Images and videos are filtered by language
# too: "en,null" = English plus images with no text (clean posters,
# backdrops). Add more, e.g. "en,ja,null".
tmdb_language = "en-US"
tmdb_image_languages = "en,null"
tmdb_video_languages = "en,null"

# Requests per second (TMDB's limit is around 40-50).
tmdb_requests_per_second = 20

# --- Streaming comparison (mogul.py movie compare) ---
# Country for "where to watch" lists (two-letter code).
watch_region = "US"
# Where each service's dated movie list is kept (re-downloadable).
providers_store = "mogul_cache/tmdb/providers"

# --- Credits check (mogul.py movie verify) ---
# Reads each movie's credits (OCR) and checks the names against TMDB, then
# moves it into <verify_target>/<result>/. Set the real folders in
# mogul.local.toml:
#   verify_source = "/media/Movies/to-verify"     # movies to check
#   verify_target = "/media/Movies/sorted"        # result folders go here
# Results (resumable): verify_results. Report: mogul_reports/movie-verify_report.html
verify_results = "mogul_cache/movie-verify_results.jsonl"

# Folder name per result. Two results can share a folder (e.g. both sure
# ones into "verified"); "" = leave those files where they are.
#   confirmed   credits back up the name                   (sure)
#   identified  the name was no help, credits found it     (sure)
#   mismatch    credits say it's a different movie          (sure it's wrong)
#   weak        a few names, or fits several movies         (check by hand)
#   unknown     no credits found / nothing matched          (check by hand)
verify_folders = { confirmed = "confirmed", identified = "identified", mismatch = "mismatch", weak = "weak", unknown = "unknown" }

# Sure ones (confirmed / identified / mismatch) are renamed to what the
# credits say; weak / unknown keep their names. Layout is flat by default
# (Radarr would take a decade folder like 1900-1909 for a movie):
#   <target>/confirmed/Fight Club (1999) {tmdb-550}/Fight Club (1999) Bluray-1080p.mkv
#   <target>/unknown/Mystery Film (2004)/mystery.mkv
# {tags} = the release info from the old filename, kept as it was.
verify_rename = true
verify_decade_folders = false        # true: <result>/1990-1999/<movie folder>/
verify_keep_source_path = false      # true: weak/unknown keep their whole path under the source
verify_folder_per_movie = true
verify_folder_format = "{title} ({year}) {{tmdb-{tmdb_id}}}"
verify_name_format = "{title} ({year}) {tags}"
verify_articles_last = true          # "The Matrix" -> "Matrix, The"

# OCR: "auto" uses EasyOCR (GPU) when installed, else Tesseract.
# Languages e.g. "en,ja" for anime / Japanese credits.
verify_ocr = "auto"
verify_ocr_langs = "en"

# How it looks (the old script's defaults):
verify_end_minutes = 12              # how much of the end to read
verify_start_minutes = 5             # opening credits, if the end isn't enough
verify_frame_every = 2.0             # seconds between frames
verify_confirm_score = 0.30          # share of top-billed cast that must be found...
verify_confirm_min_names = 3         # ...and at least this many names
verify_fuzz = 0.86                   # how close an OCR'd name must be (0-1)

[radarr]
radarr_url = "http://192.168.0.20:7878"
radarr_root_folder = "/qnap/movies-tmdb"
