# MOGUL settings
#
# THIS FILE GOES TO GITHUB. Don't put real NAS paths or drive names in
# it: put those in mogul.local.toml instead (see mogul.local.toml.example).
# mogul.local.toml never goes to GitHub and overrides anything here.
#
# Folder paths can be absolute ("/mnt/nas/..."), start with "~",
# or be relative. Relative paths are relative to the folder this
# file is in.

[core]
# Where new files are dropped, one subfolder per media type
# (mogul_incoming/radio, later mogul_incoming/audiobooks, ...).
incoming = "mogul_incoming"

# Where the catalog JSON files live. This is the source of truth:
# back it up.
json_store = "mogul_json"

# Where each scan writes its report (what was added, duplicates,
# problems).
reports = "mogul_reports"

# Hashes to store for every file. xxh64 is always included: it is
# the file ID, taken over the audio data only. The others are taken
# over the whole file. Choices: blake3, sha256, sha512, sha1, md5
# md5 and sha1 are what Internet Archive publishes for every file, so
# uploads can be checked against IA later. Entries scanned before a hash
# was added to this list get it with: mogul.py radio hashes
hashes = ["blake3", "sha256", "sha512", "sha1", "md5"]

[radio]
# --- Import (mogul.py radio import) ---
# Where sorted radio files end up. To point it at the NAS, set it in
# mogul.local.toml, not here.
library = "mogul_library/radio"

# Where extra copies of files already in the library are moved.
# Nothing is ever deleted.
dupes = "mogul_dupes/radio"

# true: a duplicate gets the same folder and name as the library file it
# matches (keeping its own extension), with (2), (3)... if there's more
# than one. false: it keeps its original name and subfolder.
rename_dupes = true

# Where bad recordings go when quarantined (mogul.py radio quarantine).
# Their catalog entries move to mogul_json/radio/_quarantine.json.
quarantine = "mogul_quarantine/radio"

# Folder layout inside the library, and the filename (the extension
# is added automatically). Tokens:
#   {show} {code} {yyyy} {mm} {dd} {month_name}
#   {HASH8} first 8 characters of the xxh64, uppercase
#   {hash8} same, lowercase
#   {part}  part number, two digits (01, 02...), for multi-part days
#   {notes} the notes from the original filename
# Anything in [square brackets] is left out when its token is empty, so
# "[_pt{part}]" only shows up for files that have a part number.
# If two different files would get the same name, the next 8
# characters of the xxh64 are used instead.
folder_template = "{show}/{yyyy}/{mm}"
filename_template = "{yyyy}-{mm}-{dd}_{code}[_pt{part}]_{HASH8}"

# --- Damaged (mogul.py radio damaged --auto-ok) ---
# --auto-ok marks a damaged file "ok" without listening when radio check
# found no more than this many seconds of audio lost, its real length
# matches its header, and there's no empty gap (seams: a faint tick).
auto_ok_max_missing = 0.5

# --- Scan (mogul.py radio scan) ---
# File types the radio scanner picks up.
extensions = ["mp3", "ogg", "oga", "opus", "m4a", "aac", "flac", "wma", "wav", "mka"]

# Store the short acoustic fingerprint digest for each file.
# Needs fpcalc (sudo apt install libchromaprint-tools).
fingerprint = true

# How incoming filenames look.
#   {code}  show code from the list below
#   {yyyy} {mm} {dd}  air date
#   [ ... ] optional part
#   {part}  part number after the date: "O&A 2005-03-14_02.mp3"
#   {notes} anything after " -- "
incoming_pattern = "{code} {yyyy}-{mm}-{dd}[_{part}][ -- {notes}]"

# Show codes -> full show names. Add more as needed.
[radio.shows]
"O&A" = "Opie and Anthony"
"R&F" = "Ron and Fez"
"HSS" = "Howard Stern Show"
"BPS" = "Black Phillip Show"
